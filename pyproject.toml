[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot_offline"
version = "0.1.0"
description = "Data collection and training for the EE52043 resistor body segmentation model"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python",
    "shapely",
    "matplotlib",
    "ultralytics",
]

[project.optional-dependencies]
dev = ["pytest"]
notebook = ["jupyter", "ipykernel", "pandas"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
