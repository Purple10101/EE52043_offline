# YOLO-seg fine-tuning. Values pass straight through to ultralytics.

[model]
weights = "yolov8m-seg.pt"  # COCO-pretrained start point

[train]
imgsz = 1024              # must equal [tiles] size in dataset.toml
epochs = 100
batch = 4                 # 8 needs about 9 GB at 1024 px and spills out of the 6 GB laptop GPU (20x slower)
workers = 2               # data-loading processes; 8 (the default) ran the 16 GB laptop out of RAM
device = 0
patience = 20
project = "runs"
name = "resistor_seg"

[augment]
# Fixed overhead camera, but bodies come in many sizes and colours: neither may be a cue. The plate is
# neutral, so a hue shift changes bodies and bands only. The band reader cuts its crops from the raw
# frame, so nothing here affects the colours it sees.
degrees = 180
fliplr = 0.5
flipud = 0.5
scale = 0.4
hsv_h = 0.5
hsv_s = 0.5
hsv_v = 0.4
mosaic = 1.0
